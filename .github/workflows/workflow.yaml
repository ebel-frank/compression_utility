name: CI

on:
   workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile code
        run: make build

      - name: Run test cases
        run: make test

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: gfwrap-binary
          path: bin/gfwrap